name: build
on:
  workflow_call:
    inputs:
      caddy_version:
        required: true
        type: string

concurrency:
  group: build-${{ inputs.caddy_version }}
  cancel-in-progress: false

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/caddy

jobs:
  build-image:
    runs-on: ubuntu-latest
    env:
      CADDY_VERSION: ${{ inputs.caddy_version }}
    outputs:
      caddy_minor: ${{ steps.version.outputs.minor }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve minor version
        id: version
        run: echo "minor=${CADDY_VERSION%.*}" >> "$GITHUB_OUTPUT"

      - name: Build base image
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            "CADDY_VERSION=${{ env.CADDY_VERSION }}"
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.minor }}
            ${{ env.IMAGE }}:${{ env.CADDY_VERSION }}

  readme:
    needs: [ build-image ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CADDY_VERSION: ${{ inputs.caddy_version }}
      CADDY_MINOR: ${{ needs.build-image.outputs.caddy_minor }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update README.md
        run: |
          README=$(<README.template.md)
          README="${README//%%IMAGE%%/$IMAGE}"

          README="${README//%%CADDY_VERSION%%/$CADDY_VERSION}"
          README="${README//%%LATEST_MINOR%%/$CADDY_MINOR}"
          README="${README//%%LATEST_PATCH%%/$CADDY_VERSION}"

          echo "$README" > README.md

      - name: Docker Hub Description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}

      - name: Git Auto Commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Automated Change
          file_pattern: '*.md'
